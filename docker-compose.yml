# Zaman — docker compose
#   docker compose up              → SQLite (simplest)
#   docker compose --profile pg up → with PostgreSQL
#   docker compose --profile ch up → with ClickHouse

services:
  zaman:
    build: .
    ports:
      - "5060:5060/udp"
      - "9060:9060/udp"
      - "9090:9090"
      - "3000:3000"
    volumes:
      - zaman-data:/app/data
    environment:
      ZAMAN_PROBE: "1"
    restart: unless-stopped

  # --- PostgreSQL (optional: docker compose --profile pg up) ---
  zaman-pg:
    build: .
    profiles: [pg]
    ports:
      - "5060:5060/udp"
      - "9060:9060/udp"
      - "9090:9090"
      - "3000:3000"
    volumes:
      - zaman-data:/app/data
    environment:
      ZAMAN_DB_DRIVER: postgres
      ZAMAN_DB_DSN: "host=postgres dbname=zaman user=zaman password=${ZAMAN_PG_PASSWORD:?set ZAMAN_PG_PASSWORD} sslmode=disable"
      ZAMAN_PROBE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: [pg]
    environment:
      POSTGRES_DB: zaman
      POSTGRES_USER: zaman
      POSTGRES_PASSWORD: "${ZAMAN_PG_PASSWORD:?set ZAMAN_PG_PASSWORD}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaman"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- ClickHouse (optional: docker compose --profile ch up) ---
  zaman-ch:
    build: .
    profiles: [ch]
    ports:
      - "5060:5060/udp"
      - "9060:9060/udp"
      - "9090:9090"
      - "3000:3000"
    volumes:
      - zaman-data:/app/data
    environment:
      ZAMAN_DB_DRIVER: clickhouse
      ZAMAN_CH_URL: "http://clickhouse:8123"
      ZAMAN_CH_DB: zaman
      ZAMAN_PROBE: "1"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    profiles: [ch]
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  zaman-data:
  pg-data:
  ch-data:
