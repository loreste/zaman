<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaman</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236d28d9'/><text x='16' y='22' text-anchor='middle' fill='white' font-family='system-ui' font-size='18' font-weight='700'>Z</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ── Tokens ── */
:root,html[data-theme='light']{
  --z-bg:#f5f5f7;--z-card:#fff;--z-line:#e8e8ec;
  --z-ink:#1a1a1f;--z-sub:#52525b;--z-dim:#a0a0ab;
  --z-field:#fff;--z-hover:#f0f0f3;
  --z-aside:#fff;--z-aside-border:#e8e8ec;
  --z-ok:#059669;--z-warn:#d97706;--z-err:#dc2626;--z-neutral:#71717a;
  --z-shadow:0 1px 2px rgba(0,0,0,.04);
  color-scheme:light
}
html[data-theme='dark']{
  --z-bg:#09090b;--z-card:#111114;--z-line:#1c1c21;
  --z-ink:#e4e4e7;--z-sub:#a1a1aa;--z-dim:#52525b;
  --z-field:#0c0c0f;--z-hover:#18181e;
  --z-aside:#0c0c0f;--z-aside-border:#1c1c21;
  --z-ok:#34d399;--z-warn:#fbbf24;--z-err:#f87171;--z-neutral:#71717a;
  --z-shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark
}

/* ── Base ── */
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--z-bg);color:var(--z-ink);-webkit-font-smoothing:antialiased;margin:0;transition:background .2s,color .2s}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.9em}

/* ── Type scale: 5 sizes only ── */
.t-xs{font-size:11px;line-height:1.4}
.t-sm{font-size:13px;line-height:1.5}
.t-base{font-size:14px;line-height:1.5}
.t-lg{font-size:18px;line-height:1.3;font-weight:600;letter-spacing:-.02em}
.t-hero{font-size:28px;line-height:1;font-weight:700;letter-spacing:-.03em}

/* ── Cards ── */
.card{background:var(--z-card);border:1px solid var(--z-line);border-radius:10px;box-shadow:var(--z-shadow)}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* ── Section label — sentence case, not uppercase ── */
.sec-label{font-size:11px;font-weight:500;color:var(--z-dim);margin-bottom:8px}

/* ── Tables ── */
table{width:100%;font-size:13px;border-collapse:collapse}
th{text-align:left;padding:8px 12px;color:var(--z-dim);font-weight:500;font-size:11px;letter-spacing:.03em;border-bottom:1px solid var(--z-line)}
td{padding:8px 12px;border-bottom:1px solid color-mix(in srgb,var(--z-line) 50%,transparent)}
tbody tr{transition:background .1s;cursor:pointer}
tbody tr:hover td{background:var(--z-hover)}
tbody tr:last-child td{border-bottom:none}

/* ── Inputs ── */
input,select,textarea{background:var(--z-field);border:1px solid var(--z-line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--z-ink);outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.1)}
input::placeholder,textarea::placeholder{color:var(--z-dim)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;border:none}
.btn-primary{background:var(--z-ink);color:var(--z-bg)}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:transparent;border:1px solid var(--z-line);color:var(--z-sub)}
.btn-ghost:hover{background:var(--z-hover);color:var(--z-ink)}

/* ── Sidebar ── */
.nav-item{display:flex;align-items:center;gap:8px;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--z-sub);text-decoration:none;transition:all .12s;white-space:nowrap}
.nav-item:hover{background:var(--z-hover);color:var(--z-ink)}
.nav-item.active{background:var(--z-hover);color:var(--z-ink);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.5}
.nav-item:hover svg,.nav-item.active svg{opacity:.8}

/* ── Semantic colors — 4 only ── */
.c-ok{color:var(--z-ok)}.c-warn{color:var(--z-warn)}.c-err{color:var(--z-err)}.c-muted{color:var(--z-neutral)}
.c-id{color:#8b5cf6} /* identifiers: call-id, links */
html[data-theme='light'] .c-id{color:#6d28d9}

/* ── Status dots ── */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-ok{background:var(--z-ok)}.dot-warn{background:var(--z-warn)}.dot-err{background:var(--z-err)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--z-dim);border-radius:9px}

/* ── Focus ── */
:focus-visible{outline:2px solid #8b5cf6;outline-offset:2px}

/* ── Mobile ── */
@media(max-width:1023px){
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
}

/* ── Animation ── */
#main{animation:fadeIn .15s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body class="h-full">
<div class="min-h-screen flex">

<!-- Mobile header -->
<div class="lg:hidden flex items-center gap-2 px-4 py-3 border-b fixed top-0 left-0 right-0 z-40" style="background:var(--z-aside);border-color:var(--z-aside-border)">

    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <span class="font-semibold text-sm">Zaman</span>
</div>

<!-- Sidebar -->

  <div class="flex items-center gap-2 mb-5 px-2">

  </div>

    <a href="#/noc" data-page="noc" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.636 18.364a9 9 0 010-12.728m12.728 0a9 9 0 010 12.728m-9.9-2.829a5 5 0 010-7.07m7.072 0a5 5 0 010 7.07M13 12a1 1 0 11-2 0 1 1 0 012 0z"/></svg>NOC</a>
    <a href="#/messages" data-page="messages" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>Messages</a>

    <a href="#/calls" data-page="calls" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>Calls</a>

    <div class="sec-label px-2 mt-4">Analyze</div>
    <a href="#/metrics" data-page="metrics" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>Metrics</a>
    <a href="#/reports" data-page="reports" class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Reports</a>

  </nav>
  <div class="mt-auto pt-3 px-2 t-xs" style="border-top:1px solid var(--z-line);color:var(--z-dim)">
    <div id="core-status" class="flex items-center gap-1.5">...</div>

</aside>

<!-- Main -->
<main id="main" class="flex-1 min-w-0 p-4 lg:px-8 lg:py-6 overflow-y-auto lg:mt-0 mt-12"></main>
</div>
<script>
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('zaman-theme',t)}catch(e){}
document.getElementById('theme-icon-dark').classList.toggle('hidden',t!=='dark');
document.getElementById('theme-icon-light').classList.toggle('hidden',t!=='light');}
function toggleTheme(){applyTheme((document.documentElement.dataset.theme||'dark')==='dark'?'light':'dark');}
applyTheme(localStorage.getItem('zaman-theme')||'dark');
</script>
<script src="/app.js"></script>
</body>
</html>
